<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Sky Millennium Clock</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; width: 360px; height: 460px; max-width: 92vw; max-height: 92vh; aspect-ratio: 180 / 230; height: auto; cursor: default; }
  #tip { position: fixed; pointer-events: none; font: 12px/1.3 system-ui, sans-serif; background: #ffffe1; color: #000; border: 1px solid #000; padding: 1px 4px; display: none; }
</style>
</head>
<body>
<canvas id="c" width="180" height="230" aria-label="Red Sky Millennium Clock. Drag the earth to spin it; the button at bottom left switches between time, date and the countdown to 2000."></canvas>
<div id="tip"></div>
<script>
// Red Sky Millennium Clock, v1.2 (6.7.98), rebuilt for the web from its original images.
// Behaviour follows the original Java classes (ClockApp, Display, ImageSequence, AtomicTime):
// a 180x230 window; five gear animations at 80 ms a frame; an earth of 120 frames, one per
// 12 minutes of GMT, that you can drag and that springs back; an 11-character readout that
// switches between time, date and seconds to 1 January 2000; a blueprint that dissolves in.
const cv = document.getElementById('c'), g = cv.getContext('2d'), tip = document.getElementById('tip');
g.imageSmoothingEnabled = false;
const IMG = {};
const names = ['blueprint.gif', 'faceplate.gif', 'alpha/ascii.gif', 'alpha/blur0.gif', 'alpha/blur1.gif', 'alpha/blur2.gif',
  'buttons/switch00.gif', 'buttons/switch01.gif', 'buttons/switch02.gif', 'buttons/setidle.gif', 'buttons/setpush.gif',
  'buttons/redskyidle.gif', 'buttons/redskypush.gif', 'topleft/x6y9f13.gif', 'topright/x89y7f5.gif',
  'midright/x160y57f5.gif', 'btmright/x85y82f13.gif', 'btmleft/x6y97f6.gif', 'earth/x42y48f120.gif'];
const load = n => new Promise(res => { const i = new Image(); i.onload = () => res(IMG[n] = i); i.src = 'images/' + n; });

// Gears: name gives position and frame count (x6y9f13 = at 6,9 with 13 frames in one row).
const GEARS = ['topleft/x6y9f13.gif', 'topright/x89y7f5.gif', 'midright/x160y57f5.gif', 'btmright/x85y82f13.gif'].map(n => {
  const m = n.match(/x(\d+)y(\d+)f(\d+)/); return { n, x: +m[1], y: +m[2], frames: +m[3], f: 0 };
});
const EARTH_GEAR = { n: 'btmleft/x6y97f6.gif', x: 6, y: 96, frames: 6, f: 0 };
const EARTH = { x: 42, y: 48, w: 81, h: 97, cols: 10, frames: 120 };
const CHARS = ' !"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const Y2K = Date.UTC(2000, 0, 1) + new Date(2000, 0, 1).getTimezoneOffset() * 60000;   // local midnight, as the original

let mode = 0;              // 0 time, 1 date, 2 seconds to Y2K
let drawMode = 'blueprint', fade = 0;
let earthFrame = 0, delta = 0, dragging = false, lastX = 0, springing = false;
let pushed = null;
const shown = Array(11).fill(' '), blur = Array(11).fill(0);

function pad(s) { s = String(s).toUpperCase(); const p = 11 - s.length; if (p <= 0) return s.slice(0, 11); const l = p >> 1; return ' '.repeat(l) + s + ' '.repeat(p - l); }
function readout(d) {
  const z = n => (n < 10 ? '0' : '') + n;
  if (mode === 0) return z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
  if (mode === 1) return MONTHS[d.getMonth()] + d.getDate() + ' ' + d.getFullYear();
  return String(Math.floor((Y2K - d.getTime() + 500) / 1000));
}
function earthFrameFor(d) { const gmt = (d.getTimezoneOffset() + d.getHours() * 60 + d.getMinutes()) % 1440; return (34 + Math.floor(gmt / 12)) % 120; }

function setText(t) {
  t = pad(t);
  for (let i = 0; i < 11; i++) if (t[i] !== shown[i]) { shown[i] = t[i]; blur[i] = 3; }   // a changed character blurs in
}

function drawChar(i) {
  const c = CHARS.indexOf(shown[i]); if (c < 0) return;
  const strip = blur[i] ? IMG['alpha/blur' + (blur[i] - 1) + '.gif'] : IMG['alpha/ascii.gif'];
  g.drawImage(strip, c * 9, 0, 9, 10, 6 + i * 16 + 4, 212, 9, 10);
}

function drawButtons() {
  g.drawImage(IMG['buttons/switch0' + mode + '.gif'], 4, 179);
  g.drawImage(IMG[pushed === 'set' ? 'buttons/setpush.gif' : 'buttons/setidle.gif'], 1, 159);
  g.drawImage(IMG[pushed === 'redsky' ? 'buttons/redskypush.gif' : 'buttons/redskyidle.gif'], 124, 157);
}

function drawLive() {
  g.drawImage(IMG['blueprint.gif'], 0, 0);
  for (const s of GEARS) g.drawImage(IMG[s.n], s.f * (IMG[s.n].width / s.frames), 0, IMG[s.n].width / s.frames, IMG[s.n].height, s.x, s.y, IMG[s.n].width / s.frames, IMG[s.n].height);
  const eg = EARTH_GEAR, ew = IMG[eg.n].width / eg.frames;
  g.drawImage(IMG[eg.n], eg.f * ew, 0, ew, IMG[eg.n].height, eg.x, eg.y, ew, IMG[eg.n].height);
  const ef = ((Math.round(earthFrame) % 120) + 120) % 120;
  g.drawImage(IMG['earth/x42y48f120.gif'], (ef % EARTH.cols) * EARTH.w, Math.floor(ef / EARTH.cols) * EARTH.h, EARTH.w, EARTH.h, EARTH.x, EARTH.y, EARTH.w, EARTH.h);
  g.drawImage(IMG['faceplate.gif'], 0, 0);
  for (let i = 0; i < 11; i++) drawChar(i);
  drawButtons();
}

function frame() {
  if (drawMode === 'blueprint') { g.drawImage(IMG['blueprint.gif'], 0, 0); }
  else if (drawMode === 'fade') {           // the original dissolved in six steps of 180 ms
    drawLive(); g.globalAlpha = 1 - fade / 6; g.drawImage(IMG['blueprint.gif'], 0, 0); g.globalAlpha = 1;
  } else drawLive();
}

async function main() {
  await Promise.all(names.map(load));
  frame();
  earthFrame = earthFrameFor(new Date());
  setText(readout(new Date())); for (let i = 0; i < 11; i++) blur[i] = 0;
  setTimeout(() => {
    drawMode = 'fade';
    const t = setInterval(() => { fade++; if (fade >= 6) { clearInterval(t); drawMode = 'live'; } }, 180);
  }, 1200);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setInterval(() => {                      // gears and the blur of changing characters
    if (!reduce) for (const s of GEARS) s.f = (s.f + 1) % s.frames;
    for (let i = 0; i < 11; i++) if (blur[i]) blur[i]--;
    if (!dragging) {
      if (Math.abs(delta) > 0.1) { earthFrame += delta; delta *= 0.95; EARTH_GEAR.f = (EARTH_GEAR.f + (delta > 0 ? 1 : 5)) % 6; }
      else {                               // spring back to the real time of day
        const target = earthFrameFor(new Date()); let d = target - earthFrame; d = ((d % 120) + 180) % 120 - 60;
        if (Math.abs(d) > 0.5) { earthFrame += Math.sign(d) * Math.min(Math.abs(d), Math.max(0.5, Math.abs(d) / 5)); EARTH_GEAR.f = (EARTH_GEAR.f + 1) % 6; }
        else earthFrame = target;
        delta = 0;
      }
    }
    frame();
  }, 80);
  setInterval(() => setText(readout(new Date())), 250);
}

// Input: canvas pixels are 180x230 drawn at 2x.
const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 180 / r.width, (e.clientY - r.top) * 230 / r.height]; };
const inR = (p, x, y, w, h) => p[0] >= x && p[0] < x + w && p[1] >= y && p[1] < y + h;
const hit = p => inR(p, 4, 179, 49, 24) ? 'mode' : inR(p, 1, 159, 17, 15) ? 'set' : inR(p, 124, 157, 47, 44) ? 'redsky' : inR(p, 42, 48, 81, 97) ? 'earth' : null;
const TIPS = { mode: 'switch mode', set: 'synchronize', redsky: 'redsky.com' };
cv.addEventListener('pointerdown', e => {
  const p = pt(e), h = hit(p);
  if (h === 'earth') { dragging = true; lastX = p[0]; delta = 0; cv.setPointerCapture(e.pointerId); }
  else if (h) pushed = h;
});
cv.addEventListener('pointermove', e => {
  const p = pt(e), h = hit(p);
  cv.style.cursor = h ? (h === 'earth' ? 'grab' : 'pointer') : 'default';
  if (TIPS[h]) { tip.textContent = TIPS[h]; tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 16 + 'px'; } else tip.style.display = 'none';
  if (dragging) { const dx = p[0] - lastX; lastX = p[0]; delta = -dx / 3; earthFrame += delta; EARTH_GEAR.f = (EARTH_GEAR.f + 1) % 6; }
});
cv.addEventListener('pointerup', e => {
  const h = hit(pt(e));
  if (dragging) { dragging = false; delta *= 1.2; }
  if (pushed && h === pushed) {
    if (h === 'mode') { mode = (mode + 1) % 3; setText(readout(new Date())); }
    if (h === 'set') { earthFrame = earthFrameFor(new Date()); delta = 0; for (let i = 0; i < 11; i++) blur[i] = 3; }
    if (h === 'redsky') window.open('https://web.archive.org/web/1999/http://www.millennium.redsky.com/', '_blank', 'noopener');
  }
  pushed = null;
});
cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
main();
</script>
</body>
</html>
